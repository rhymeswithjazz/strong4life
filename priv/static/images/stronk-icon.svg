<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#0f172a"/>

  <!-- Barbell Icon - Centered and Larger -->
  <g transform="translate(256, 256)">
    <!-- Left weight plate -->
    <rect x="-180" y="-60" width="60" height="120" rx="8" fill="#34d399"/>
    <rect x="-175" y="-50" width="50" height="100" rx="6" fill="#10b981"/>

    <!-- Left handle connection -->
    <rect x="-120" y="-30" width="40" height="60" rx="4" fill="#059669"/>

    <!-- Bar -->
    <rect x="-80" y="-15" width="160" height="30" rx="4" fill="#6ee7b7"/>

    <!-- Right handle connection -->
    <rect x="80" y="-30" width="40" height="60" rx="4" fill="#059669"/>

    <!-- Right weight plate -->
    <rect x="120" y="-60" width="60" height="120" rx="8" fill="#34d399"/>
    <rect x="125" y="-50" width="50" height="100" rx="6" fill="#10b981"/>
  </g>
</svg>
